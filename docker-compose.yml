# Stack del backend para Portainer (Stacks > Add stack > Repository o Web editor).
# Las variables se definen en el propio stack de Portainer; Portainer las guarda
# en stack.env, que este compose carga. Ver .env.example.
services:
  fabribat-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fabribat-api:latest
    container_name: fabribat-api
    restart: unless-stopped
    env_file:
      - stack.env
    ports:
      - "8000:8000"
    # Solo si se usa Google Secret Manager desde el servidor local: monta el JSON de la
    # cuenta de servicio (fuera del repo) y define en el stack
    # GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-sa.json
    # volumes:
    #   - /opt/fabribat/gcp-sa.json:/run/secrets/gcp-sa.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
