# Stack del backend para Portainer (Stacks > Add stack > Repository o Web editor).
# Las variables se definen en el propio stack de Portainer; Portainer las guarda
# en stack.env, que este compose carga. Ver .env.example.
#
# Publicación con el Traefik existente en la VM (https://DOMINIO/api/*).
# Variables del stack para Traefik (además de las de .env.example):
#   DOMINIO               ej. conciliacion.fabribat.com
#   TRAEFIK_NETWORK       red Docker donde está Traefik      (por defecto: web-network)
#   TRAEFIK_ENTRYPOINT    entrypoint HTTPS de Traefik        (por defecto: websecure)
#   TRAEFIK_CERTRESOLVER  certresolver de Let's Encrypt      (por defecto: myresolver)
#   MINIO_NETWORK         red Docker de MinIO                (por defecto: minio-cs-apps_default)
services:
  fabribat-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fabribat-api:latest
    # La imagen se construye en la VM, no existe en Docker Hub: nunca intentar descargarla
    pull_policy: build
    container_name: fabribat-api
    restart: unless-stopped
    env_file:
      - stack.env
    # Sin puertos publicados en la VM: solo Traefik llega al contenedor por la red Docker.
    # (Para depurar desde la VM: docker exec, o descomentar con un puerto libre)
    # ports:
    #   - "127.0.0.1:18000:8000"
    networks:
      - traefik          # Traefik y postgres_db
      - minio            # minio_server
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-web-network}"
      - "traefik.http.routers.fabribat-api.rule=Host(`${DOMINIO:?Defina DOMINIO}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.fabribat-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fabribat-api.tls=true"
      - "traefik.http.routers.fabribat-api.tls.certresolver=${TRAEFIK_CERTRESOLVER:-myresolver}"
      - "traefik.http.services.fabribat-api.loadbalancer.server.port=8000"
    # Solo si se usa Google Secret Manager FUERA de GCP: monta el JSON de la cuenta de
    # servicio (fuera del repo) y define GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/gcp-sa.json
    # volumes:
    #   - /opt/fabribat/gcp-sa.json:/run/secrets/gcp-sa.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-web-network}
  minio:
    external: true
    name: ${MINIO_NETWORK:-minio-cs-apps_default}
